<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- PinPatch banner: a looping 6 s story. A procedure runs, step 3 fails, a probe pins the
       faulty step from the hidden state, a patch is applied and the run succeeds. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F4FF"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2F8"/>
    </linearGradient>
    <linearGradient id="vio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C63D9"/>
      <stop offset="1" stop-color="#9A6CE0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1280" height="300" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="40" r="120" fill="#6C63D9" opacity="0.10" filter="url(#soft)"/>
  <circle cx="160" cy="280" r="110" fill="#4A6FA5" opacity="0.08" filter="url(#soft)"/>

  <!-- logo mark: a map pin carrying a patch -->
  <g transform="translate(70,58)">
    <path d="M60,0 C26,0 0,26 0,60 C0,102 60,168 60,168 C60,168 120,102 120,60 C120,26 94,0 60,0 Z" fill="url(#vio)"/>
    <g transform="translate(60,58) rotate(-35)">
      <rect x="-36" y="-14" width="72" height="28" rx="14" fill="#FFFFFF"/>
      <rect x="-12" y="-14" width="24" height="28" fill="#E2DEFA"/>
      <circle cx="-4" cy="-5" r="2.6" fill="#6C63D9"/><circle cx="4" cy="-5" r="2.6" fill="#6C63D9"/>
      <circle cx="-4" cy="5" r="2.6" fill="#6C63D9"/><circle cx="4" cy="5" r="2.6" fill="#6C63D9"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="222" y="132" font-size="78" font-weight="800" fill="#1F1F1D" letter-spacing="-1">Pin<tspan fill="#6C63D9">Patch</tspan></text>
  <text x="226" y="180" font-size="25" font-weight="600" fill="#3B3A36">Learning from Failure without Self-Diagnosis</text>
  <text x="226" y="216" font-size="21" font-weight="500" fill="#6B6A66">Self-evolving procedures for small LLM agents</text>

  <!-- animated mini-story -->
  <g transform="translate(846,78) scale(0.86)">
    <text x="0" y="-14" font-size="17" font-weight="700" fill="#6B6A66" letter-spacing="1.5">ONE EPISODE</text>
    <!-- four steps -->
    <g font-size="15" font-weight="700" text-anchor="middle" fill="#1F1F1D">
      <rect x="0" y="0" width="96" height="70" rx="14" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
      <text x="48" y="42">go to</text>
      <rect x="112" y="0" width="96" height="70" rx="14" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
      <text x="160" y="42">pick up</text>
      <rect id="s3" x="224" y="0" width="96" height="70" rx="14" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5">
        <animate attributeName="stroke" values="#2B2B2B;#2B2B2B;#D64545;#D64545;#6C63D9;#6C63D9;#2B2B2B" keyTimes="0;0.25;0.3;0.55;0.62;0.95;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#FFFFFF;#FFFFFF;#FFF1F1;#FFF1F1;#F1EFFC;#F1EFFC;#FFFFFF" keyTimes="0;0.25;0.3;0.55;0.62;0.95;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="272" y="42">focus</text>
      <rect x="336" y="0" width="96" height="70" rx="14" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2.5"/>
      <text x="384" y="42">read</text>
    </g>
    <!-- running cursor over the steps -->
    <circle r="7" cy="-2" fill="#4A6FA5">
      <animate attributeName="cx" values="48;160;272;272;272;384;384" keyTimes="0;0.12;0.24;0.62;0.72;0.86;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;0;1;1;0" keyTimes="0;0.24;0.28;0.6;0.66;0.9;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- hidden-state credit strip -->
    <g>
      <rect x="0" y="86" width="96" height="16" rx="6" fill="#ECEAFB"/>
      <rect x="112" y="86" width="96" height="16" rx="6" fill="#E4E1FA"/>
      <rect x="224" y="86" width="96" height="16" rx="6" fill="#ECEAFB">
        <animate attributeName="fill" values="#ECEAFB;#ECEAFB;#A99FF0;#A99FF0;#ECEAFB" keyTimes="0;0.32;0.38;0.9;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="336" y="86" width="96" height="16" rx="6" fill="#ECEAFB"/>
      <text x="0" y="128" font-size="15" font-weight="700" fill="#6B6A66">credit from hidden states</text>
    </g>
    <!-- magnifier pinning the faulty step -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.38;0.6;0.66" dur="6s" repeatCount="indefinite"/>
      <circle cx="272" cy="94" r="22" fill="none" stroke="#6C63D9" stroke-width="5"/>
      <line x1="288" y1="110" x2="304" y2="126" stroke="#6C63D9" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- outcome badge -->
    <g transform="translate(470,35)">
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.3;0.56;0.6;1" dur="6s" repeatCount="indefinite"/>
        <circle r="24" fill="#D64545"/>
        <path d="M-9,-9 L9,9 M9,-9 L-9,9" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <text x="0" y="50" font-size="15" font-weight="700" text-anchor="middle" fill="#D64545">fail</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.84;0.88;0.97;1" dur="6s" repeatCount="indefinite"/>
        <circle r="24" fill="#1E9E62"/>
        <path d="M-10,0 L-3,8 L11,-8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="0" y="50" font-size="15" font-weight="700" text-anchor="middle" fill="#1E9E62">patched</text>
      </g>
    </g>
    <!-- the patch landing on step 3 -->
    <g opacity="0" transform="translate(272,-6) rotate(-30)">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.66;0.95;1" dur="6s" repeatCount="indefinite"/>
      <rect x="-26" y="-10" width="52" height="20" rx="10" fill="#F7E3C4" stroke="#B98A4E" stroke-width="2"/>
      <rect x="-8" y="-10" width="16" height="20" fill="#EBCB9A"/>
    </g>
  </g>
</svg>
